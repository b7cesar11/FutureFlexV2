name: Future Flex Dependency Audit

on:
  push:
    branches: [agent/release-dependency-audit]
  pull_request:
    branches: [agent/release-v1-hardening]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Frontend production dependency audit
        working-directory: frontend
        run: |
          set +e
          yarn audit --groups dependencies --level low
          code=$?
          echo "FRONTEND_AUDIT_EXIT=$code"
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Backend requirements audit
        run: |
          set +e
          python -m pip_audit -r backend/requirements.txt --desc
          code=$?
          echo "BACKEND_AUDIT_EXIT=$code"
          exit 0
